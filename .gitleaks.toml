# gitleaks config for VirelNode repos.
# Starts from gitleaks' built-in rules and adds what they miss.
# Keep allowlists narrow: only obvious placeholders and known non-secret hash keys.
#
# False positive on a line you are adding? Prefer, in this order:
#   1. Use an obvious placeholder or an env var reference (${DB_PASSWORD}).
#   2. Add the inline comment  gitleaks:allow  on that line, and say why in the PR.
#   3. Add the finding's fingerprint to .gitleaksignore.
# Never widen the allowlist below to make a real secret pass.
title = "VirelNode gitleaks config"

[extend]
useDefault = true

# Built-in rules do not catch a password inside a database URL
# (postgres://user:PASSWORD@host). This is the leak that started this.
[[rules]]
id = "db-url-with-password"
description = "Database or broker URL with an inline password"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?)://[^:/@\s"'`]+:([^@\s"'`]{3,})@'''
secretGroup = 1
keywords = ["postgres", "mysql", "mariadb", "mongodb", "redis", "amqp"]

  [rules.allowlist]
  description = "Placeholders and env-var references, not real passwords"
  regexTarget = "secret"
  regexes = [
    '''(?i)^(?:postgres|password|pass|passwd|secret|changeme|example|test|dummy|placeholder|redacted|x+|\*+)$''',
    '''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''',
    '''^<[^>]+>$''',
    '''^\{\{[^}]+\}\}$''',
    '''(?i)^your[-_]''',
    '''^(?:\.+|-+|_+|#+|0+)$''',
  ]

[[rules]]
id = "pg-password-assignment"
description = "PGPASSWORD set to a literal value"
regex = '''\bPGPASSWORD\s*=\s*['"]?([^\s'"$`][^\s'"`]{2,})'''
secretGroup = 1
keywords = ["pgpassword"]

  [rules.allowlist]
  regexTarget = "secret"
  regexes = ['''(?i)^(?:postgres|password|changeme|example|test|dummy|placeholder|redacted|x+)$''']

[allowlist]
description = "Global allowlist: obvious placeholders and lockfiles"
paths = [
  '''(?:^|/)(?:package-lock\.json|pnpm-lock\.yaml|yarn\.lock|poetry\.lock|uv\.lock|Cargo\.lock|go\.sum)$''',
]
# Hash-style identifiers that the generic rule mistakes for keys
# (content hashes, idempotency keys, manifest keys). Matched on the whole line.
regexTarget = "line"
regexes = [
  '''(?i)["'`]?\w*(?:manifest|group|rollback|scope|idempotency|dedupe|cache|partition|run|lock|storage|library|persist)_?key(?:_?sha256)?["'`]?\s*[:=]''',
  '''(?i)["']?claim_token["']?\s*:''',
  '''(?i)\b(?:sha256|sha1|md5|checksum|digest|integrity)"?\s*[:=]''',
]
stopwords = [
  "example", "placeholder", "changeme", "your-api-key", "your_api_key", "xxxxxxxx", "dummy",
]
