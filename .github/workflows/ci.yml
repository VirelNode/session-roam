name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite (default bash)
        run: bash tests/run.sh
      - name: Run test suite (system /bin/bash — macOS 3.2 portability)
        if: runner.os == 'macOS'
        run: /bin/bash tests/run.sh
