name: Secret scan

# Scans only the commits a push or PR adds, so old findings in history don't block new work.
# Run it by hand (Actions > Secret scan > Run workflow) for a full-history audit.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan new commits (secrets are redacted in the log)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                range="$PUSH_BEFORE..$SHA"
              elif [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ] && git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH" >/dev/null; then
                range="origin/$DEFAULT_BRANCH..$SHA"   # new branch: everything not yet on the default branch
              else
                range="-1 $SHA"
              fi ;;
            *)
              range="--all" ;;                         # manual run: full history audit
          esac
          echo "Scanning: $range"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="$range" .
